<!DOCTYPE html>
<html lang="en" data-bs-theme="auto"> 
<head> 
  <meta charset="utf-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1" /> 
  <title>Newsletter SignUp</title> 

  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet" 
  /> 
</head> 

<body class="bg-secondary d-flex justify-content-center align-items-center min-vh-100 text-center">

  <div class="card shadow-lg" style="width: 23rem;">
    <div class="card-body">
      <main class="form-signin"> 
        <form action="/" method="post"> 
          <img class="mb-4" src="logop.png" alt="Logo" width="100" height="100" /> 
          <h1 class="h4 mb-3 fw-bold text-dark">Your Details for Newsletter</h1> 

          <div class="form-floating mb-3"> 
            <input type="text" class="form-control" name="firstName" id="firstName" placeholder="First Name" required>
            <label for="firstName">First Name</label>  
          </div>

          <div class="form-floating mb-3"> 
            <input type="text" class="form-control" name="lastName" id="lastName" placeholder="Last Name" required>
            <label for="lastName">Last Name</label>  
          </div>

          <div class="form-floating mb-3"> 
            <input type="email" class="form-control" name="email" id="email" placeholder="name@example.com" required /> 
            <label for="email">Email Address</label> 
          </div> 

          <button class="btn btn-primary w-100 py-2 fw-semibold" type="submit">Sign Me Up!</button> 

          <p class="mt-4 mb-0 text-muted small">&copy; 2025 Newsletterss</p> 
        </form>
      </main> 
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 
</body>
</html>
